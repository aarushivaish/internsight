{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login – InternSight</title>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root {
  --bg:#f4f3f0;
  --card:#ffffff;
  --accent:#1e2d4a;
  --accent2:#3d5a80;
  --gold:#c8a96e;
  --ink:#1a1a1a;
  --muted:#6b6b6b;
}

body {
  font-family:'DM Sans',sans-serif;
  background:var(--bg);
  display:flex;
  align-items:center;
  justify-content:center;
  height:100vh;
  position: relative;   
}

/* Card */
.auth-card {
  background:var(--card);
  padding:48px;
  border-radius:20px;
  width:360px;
  box-shadow:0 20px 50px rgba(30,45,74,0.1);
}

/* Title */
.auth-card h2 {
  font-family:'Syne',sans-serif;
  font-weight:800;
  color:var(--accent);
  margin-bottom:10px;
}

.auth-card p {
  color:var(--muted);
  margin-bottom:30px;
  font-size:0.9rem;
}

/* Inputs */
input {
  width:100%;
  padding:12px;
  margin-bottom:16px;
  border-radius:8px;
  border:1px solid #ddd;
  font-size:0.9rem;
}

/* Button */
button {
  width:100%;
  padding:12px;
  background:var(--accent);
  color:#fff;
  border:none;
  border-radius:8px;
  font-weight:500;
  cursor:pointer;
}

button:hover {
  background:var(--accent2);
}

/* Link */
.switch {
  margin-top:18px;
  text-align:center;
  font-size:0.85rem;
}

.switch a {
  color: var(--accent);
  text-decoration: none;
  font-weight: 500;
  position: relative;
}

.switch a::after {
  content: '';
  position: absolute;
  left: 0;
  bottom: -2px;
  width: 0;
  height: 1.5px;
  background: var(--accent);
  transition: width 0.25s ease;
}

.switch a:hover::after {
  width: 100%;
}

.error {
  color: #d11a2a;
  font-size: 0.85rem;
  margin-bottom: 12px;
}
.auth-logo {
  position: absolute;
  top: 32px;
  left: 40px;
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 1.2rem;
  color: var(--accent);
  display: flex;
  align-items: center;
  gap: 8px;
}

.auth-logo .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--gold);
}
</style>
</head>

<body>
<div class="auth-logo">
    <span class="dot"></span>InternSight
</div>
<div class="auth-card">
  <h2>Welcome Back</h2>
  <p>Sign in to continue to InternSight</p>

  <form method="POST">
    {% csrf_token %}
    <input type="text" name="username" placeholder="Username" required>
    <input type="password" name="password" placeholder="Password" required>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <button type="submit">Login</button>
  </form>

  <div class="switch">
    Don’t have an account? <a href="{% url 'signup' %}">Sign up</a>
  </div>
</div>

</body>
</html>
